name: Grade PCEP Rubric

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    name: Rubric grading
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment (Part 1)
        run: |
          python --version
          python - <<'PY'
          import importlib
          required = ["datasets", "pandas", "matplotlib", "seaborn", "pyarrow"]
          for name in required:
              mod = importlib.import_module(name)
              print(f"{name}: {getattr(mod, '__version__', 'ok')}")
          PY

      - name: Grade against project rubric
        run: python scripts/grade_rubric.py --github-summary --markdown grade-report.md

      - name: Upload grade report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pcep-rubric-grade-report
          path: grade-report.md
          if-no-files-found: ignore
